# Strangler extraction flags (all OFF: monolith behaviour is unchanged). Restart to flip.
extraction.favorite.enabled=${EXTRACTION_FAVORITE_ENABLED:false}
extraction.favorite.read=${EXTRACTION_FAVORITE_READ:monolith}
extraction.favorite.write=${EXTRACTION_FAVORITE_WRITE:monolith}
extraction.favorite.base-url=${EXTRACTION_FAVORITE_BASE_URL:http://localhost:8081}
extraction.favorite.connect-timeout=500ms
extraction.favorite.read-timeout=1500ms
extraction.favorite.fallback=${EXTRACTION_FAVORITE_FALLBACK:monolith}
extraction.comment.enabled=${EXTRACTION_COMMENT_ENABLED:false}
extraction.comment.read=${EXTRACTION_COMMENT_READ:monolith}
