name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    name: Build & Test (JDK 11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # Caches the Gradle wrapper distribution, dependency jars, transforms and the
      # local build cache (task outputs). Only pushes to develop/main write the cache;
      # PR builds read it, so cache entries stay small and deterministic.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success
          add-job-summary: on-failure

      - name: Verify JDK version
        run: |
          java -version
          ./gradlew --version

      # jacocoTestReport still runs (finalizedBy on test) so coverage is visible,
      # but the pre-existing 80% gate is skipped per AGENTS.md.
      # seleniumTest is a separate task and is intentionally not part of this gate.
      - name: Build (unit tests, Spotless, JaCoCo report)
        run: ./gradlew build -x jacocoTestCoverageVerification --build-cache

      - name: Coverage summary
        if: always()
        run: |
          if [ -f build/reports/jacoco/test/jacocoTestReport.xml ]; then
            python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import re
          xml = open('build/reports/jacoco/test/jacocoTestReport.xml').read()
          m = re.findall(r'<counter type="INSTRUCTION" missed="(\d+)" covered="(\d+)"/>', xml)
          missed, covered = map(int, m[-1])
          pct = 100.0 * covered / (missed + covered)
          print(f"### JaCoCo instruction coverage: {pct:.1f}% (gate: 80%, not enforced in CI)")
          EOF
          fi

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/reports/tests/
            build/reports/jacoco/
            build/test-results/
          if-no-files-found: warn

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 1

  dependency-scan:
    name: Dependency scan (non-blocking)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Download application jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs

      - name: Resolve runtime dependencies
        run: |
          mkdir -p build/dependency-scan
          ./gradlew dependencies --configuration runtimeClasspath \
            > build/dependency-scan/runtime-dependencies.txt

      # The NVD database download dominates scan time; cache it between runs.
      - name: Cache OWASP Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: dependency-check-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dependency-check-data-${{ runner.os }}-

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: uc-spring-boot-upgrade-microservice-extraction
          path: build/libs
          format: HTML
          out: build/dependency-scan
          args: >-
            --failOnCVSS 11
            --data /github/home/.dependency-check/data
            ${{ secrets.NVD_API_KEY != '' && format('--nvdApiKey {0}', secrets.NVD_API_KEY) || '' }}

      - name: Upload dependency reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan
          path: build/dependency-scan/
          if-no-files-found: warn
