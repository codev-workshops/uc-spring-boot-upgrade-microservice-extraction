# Overlay: in-cluster PostgreSQL StatefulSet instead of SQLite on a PVC. Layer it on top of an
# environment file:
#   helm install rw helm/ -f helm/values-dev.yaml  -f helm/values-postgresql.yaml
#   helm install rw helm/ -f helm/values-prod.yaml -f helm/values-postgresql.yaml
# The backend's datasource URL, driver, username and password are wired to the StatefulSet
# by the chart. Because the database is no longer a file on a ReadWriteOnce volume, the
# backend can run several replicas (the HPA in values-prod.yaml works with it).
backend:
  config:
    # application-prod.properties: PostgreSQL, no SQLite-only demo seed data.
    SPRING_PROFILES_ACTIVE: prod
  # JWT_SECRET: generated by the chart unless secret.existingSecret is set (values-prod.yaml).
  secret:
    create: true
  persistence:
    enabled: false

postgresql:
  enabled: true
