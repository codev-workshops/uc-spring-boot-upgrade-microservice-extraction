{{- $f := .Values.frontend }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "realworld.frontend.fullname" . }}
  labels:
    {{- include "realworld.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  replicas: {{ $f.replicaCount }}
  selector:
    matchLabels:
      {{- include "realworld.selectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/frontend/configmap.yaml") . | sha256sum }}
        {{- with $f.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "realworld.componentLabels" (dict "root" . "component" "frontend") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $f.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "realworld.image" (dict "root" . "image" $f.image) | quote }}
          imagePullPolicy: {{ $f.image.pullPolicy }}
          {{- with $f.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $f.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "realworld.frontend.fullname" . }}
          env:
            - name: PORT
              value: {{ $f.containerPort | quote }}
            {{- with $f.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $f.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $f.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $f.resources | nindent 12 }}
          volumeMounts:
            # npm and Next.js write caches/logs at runtime; the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
            - name: npm-cache
              mountPath: /home/node/.npm
      volumes:
        - name: tmp
          emptyDir: {}
        - name: npm-cache
          emptyDir: {}
      {{- with $f.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $f.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $f.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
