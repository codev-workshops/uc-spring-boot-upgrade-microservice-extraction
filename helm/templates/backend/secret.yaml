{{- if and .Values.backend.secret.create (not .Values.backend.secret.existingSecret) }}
{{- $name := include "realworld.backend.secretName" . }}
{{- $data := deepCopy .Values.backend.secret.data }}
{{- if not (hasKey $data "JWT_SECRET") }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing (index $existing.data "JWT_SECRET") }}
{{- $_ := set $data "JWT_SECRET" (index $existing.data "JWT_SECRET" | b64dec) }}
{{- else }}
{{- $_ := set $data "JWT_SECRET" (randAlphaNum 86) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "realworld.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
