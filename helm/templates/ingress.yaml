{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "realworld.fullname" . }}
  labels:
    {{- include "realworld.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: {{ .Values.ingress.paths.backend }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "realworld.backend.fullname" . }}
                port:
                  name: http
          - path: {{ .Values.ingress.paths.frontend }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "realworld.frontend.fullname" . }}
                port:
                  name: http
{{- end }}
