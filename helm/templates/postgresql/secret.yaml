{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- $name := include "realworld.postgresql.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := .Values.postgresql.auth.password }}
{{- if not $password }}
{{- if and $existing (index $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "realworld.componentLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
  annotations:
    # The password must keep matching the data on the (retained) StatefulSet volume.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  username: {{ .Values.postgresql.username | quote }}
  password: {{ $password | quote }}
{{- end }}
