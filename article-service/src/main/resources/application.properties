server.port=8081
spring.application.name=article-service
spring.jackson.deserialization.UNWRAP_ROOT_VALUE=true

# Own database: articles, tags and article_tags only
spring.datasource.url=jdbc:sqlite:article-service.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Monolith that owns users, follows and favorites
user-service.base-url=${USER_SERVICE_BASE_URL:http://localhost:8080}
user-service.connect-timeout=2s
user-service.read-timeout=5s

mybatis.configuration.cache-enabled=true
mybatis.configuration.default-statement-timeout=3000
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.use-generated-keys=true
mybatis.type-handlers-package=io.spring.articles.infrastructure.mybatis
mybatis.mapper-locations=mapper/*.xml
